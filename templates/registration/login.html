{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth_content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background: var(--bg);">
    <div class="card p-4" style="width: 360px;">
        <div class="d-flex align-items-center gap-2 justify-content-center mb-1">
            <div class="sidebar-brand-mark">PE</div>
            <div class="sidebar-brand-name fs-5">{{ COMPANY_NAME }}</div>
        </div>
        <p class="text-muted text-center small mb-4">Staff login</p>
        {% if form.errors %}
            <div class="alert alert-danger py-2">Incorrect username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>
        <div class="theme-toggle mt-3">
            <button type="button" id="pe-theme-light" onclick="peSetTheme('light')">Light</button>
            <button type="button" id="pe-theme-dark" onclick="peSetTheme('dark')">Dark</button>
        </div>
    </div>
</div>
{% endblock %}
