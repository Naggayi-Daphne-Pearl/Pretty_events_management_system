<div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <div><h3 class="mb-0">{{ title }}</h3><span class="small text-muted">{{ COMPANY_NAME }} · {{ subtitle }} · Cash basis · {{ CURRENCY }}</span></div>
    <div class="d-flex gap-1">
        <a href="?{{ request.GET.urlencode }}{% if request.GET %}&{% endif %}format=csv" class="btn btn-outline-secondary btn-sm"><i class="bi bi-download me-1"></i>CSV</a>
        <button type="button" onclick="window.print()" class="btn btn-outline-secondary btn-sm"><i class="bi bi-printer me-1"></i>Print</button>
    </div>
</div>
