<div class="d-flex gap-1 flex-wrap mb-3">
    <a href="{% url 'accounting:chart' %}" class="btn btn-sm {% if request.resolver_match.url_name == 'chart' or 'account_' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-secondary{% endif %}"><i class="bi bi-diagram-3 me-1"></i>Chart of accounts</a>
    <a href="{% url 'accounting:journal_list' %}" class="btn btn-sm {% if 'journal' in request.resolver_match.url_name %}btn-primary{% else %}btn-outline-secondary{% endif %}"><i class="bi bi-journal-text me-1"></i>Journals</a>
    <a href="{% url 'accounting:banking' %}" class="btn btn-sm {% if request.resolver_match.url_name == 'banking' or request.resolver_match.url_name == 'transfer_create' %}btn-primary{% else %}btn-outline-secondary{% endif %}"><i class="bi bi-bank me-1"></i>Banking</a>
    <a href="{% url 'accounting:reports' %}" class="btn btn-sm {% if request.resolver_match.url_name in 'reports,trial_balance,income_statement,balance_sheet' %}btn-primary{% else %}btn-outline-secondary{% endif %}"><i class="bi bi-bar-chart-line me-1"></i>Reports</a>
</div>
