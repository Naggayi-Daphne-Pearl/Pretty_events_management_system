<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Something Went Wrong · Pretty Events</title>
<!--
    Deliberately self-contained, not extending the main site layout: a 500
    means something already broke, so this page must not depend on context
    processors or other app state that might be part of the problem.
-->
<style>
    body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: #0d0c10; color: rgba(255,255,255,0.94);
    }
    .box { text-align: center; max-width: 440px; padding: 32px; }
    .code { font-size: 4.5rem; font-weight: 700; color: #D8B27C; line-height: 1; margin-bottom: 8px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    p { color: rgba(255,255,255,0.72); margin: 0 0 24px; }
    a.btn {
        display: inline-block; padding: 10px 20px; border-radius: 10px; text-decoration: none;
        background: linear-gradient(150deg, #D8B27C, #8a6530); color: #1c1409; font-weight: 600;
    }
</style>
</head>
<body>
<div class="box">
    <div class="code">500</div>
    <h1>Something went wrong on our end</h1>
    <p>This wasn't caused by anything you did. Please try again in a moment — if it keeps happening, let whoever manages this system know.</p>
    <a class="btn" href="/">Back to Pretty Events</a>
</div>
</body>
</html>
