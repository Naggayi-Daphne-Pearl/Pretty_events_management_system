<div class="text-center py-5">
    <div class="mb-2" style="font-family: var(--serif); font-size: 4.5rem; font-weight: 600; color: var(--gold); line-height: 1;">{{ error_code }}</div>
    <h3 class="mb-2">{{ error_title }}</h3>
    <p class="text-muted mb-4" style="max-width: 420px; margin-left: auto; margin-right: auto;">{{ error_message }}</p>
    <div class="d-flex justify-content-center gap-2">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}" class="btn btn-primary"><i class="bi bi-speedometer2 me-1"></i>Back to Dashboard</a>
        {% else %}
            <a href="{% url 'login' %}" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Go to Login</a>
        {% endif %}
        <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
    </div>
</div>
